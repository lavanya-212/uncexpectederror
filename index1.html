<!DOCTYPE html>
<html>

<head>

<title>Happy Birthday Nanna ❤️</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="page">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<h1 class="birthday-title">

Happy Birthday ♡

</h1>
<h2 class="name-title">

Ganesh • Chinna • Chinnodu • Nanna

</h2>

<p class="subtitle">

Counting Every Second Until Your Birthday.. ♡

</p>
<div class="countdown-boxes">

<div class="time-box">
<span id="days">0</span>
<p>Days</p>
</div>

<div class="time-box">
<span id="hours">0</span>
<p>Hours</p>
</div>

<div class="time-box">
<span id="minutes">0</span>
<p>Minutes</p>
</div>

<div class="time-box">
<span id="seconds">0</span>
<p>Seconds</p>
</div>

</div>

<br>

<button onclick="window.location.href='about.html'">

🎁 Open Birthday Surprise ❤️

</button>

</div>

</div>

<script>

const birthday =
new Date("December 2, 2026 00:00:00").getTime();

setInterval(function(){

let now = new Date().getTime();

let distance = birthday-now;

let days=Math.floor(distance/(1000*60*60*24));

let hours=Math.floor((distance%(1000*60*60*24))/(1000*60*60));

let minutes=Math.floor((distance%(1000*60*60))/(1000*60));

let seconds=Math.floor((distance%(1000*60))/1000);

document.getElementById("days").innerHTML=days;

document.getElementById("hours").innerHTML=hours;

document.getElementById("minutes").innerHTML=minutes;

document.getElementById("seconds").innerHTML=seconds;

},1000);

</script>

<script src="script.js"></script>

</body>

</html>
